<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمرەی قوتابی</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, sans-serif; background: #eef2f7; padding: 30px; }
    .box { max-width: 600px; margin: auto; background: #fff; padding: 25px;
           border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
    h1 { color: #0f7b4d; text-align: center; margin-bottom: 20px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0;
                    border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { background: #0f7b4d; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #0a5c39; }
    .card { background: #f8fafc; border-right: 5px solid #0f7b4d;
            padding: 15px; margin: 10px 0; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; }
    .score { font-weight: bold; color: #0f7b4d; font-size: 18px; }
    .err { color: #c0392b; text-align: center; margin-top: 15px; }
    .info { color: #666; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>بینینی نمرەکان</h1>

    <form id="form">
      <input type="text" id="studentId" placeholder="ناسنامەی قوتابی (بۆ نموونە S001)" required>
      <button type="submit">گەڕان</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    // ⚠️ دۆمەینی ڕاستەقینەی سەرڤەری مامۆستا لێرە دابنێ
    const TEACHER_API = 'https://YOUR-TEACHER-PROJECT.vercel.app';

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('studentId').value.trim();
      const box = document.getElementById('result');
      box.innerHTML = '<p class="info">چاوەڕوان بە...</p>';

      try {
        const res = await fetch(`${TEACHER_API}/api/scores/${id}`);
        const list = await res.json();

        if (!list.length) {
          box.innerHTML = '<p class="err">هیچ نمرەیەک نەدۆزرایەوە بۆ ئەم قوتابییە.</p>';
          return;
        }

        box.innerHTML = list.map(s =>
          `<div class="card">
             <span>${s.course}</span>
             <span class="score">${s.score}</span>
           </div>`
        ).join('');
      } catch (err) {
        box.innerHTML = '<p class="err">هەڵە لە پەیوەندی بە سەرڤەر.</p>';
        console.error(err);
      }
    };
  </script>
</body>
</html>
